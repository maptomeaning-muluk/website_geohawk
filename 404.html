<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0A1F3C;color:#EAF1F8;font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;text-align:center;padding:24px;position:relative}
  main{max-width:580px;width:100%;margin:auto}
  img.logo{width:190px;height:auto;margin:0 auto 28px;display:block}
  .tag{display:inline-block;background:rgba(23,138,78,.2);border:1px solid rgba(110,224,163,.3);color:#6EE0A3;font-size:.82rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:999px;margin-bottom:16px}
  h1{font-size:clamp(1.9rem,5vw,2.7rem);font-weight:800;margin:0 0 12px;color:#fff;line-height:1.2}
  p{color:#A9BBD0;margin:0 auto 32px;font-size:1.05rem;line-height:1.6;max-width:44ch}
  .btns{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:10px;font-weight:700;font-size:1rem;text-decoration:none;transition:transform .15s,background .15s}
  .btn:hover{transform:translateY(-1px)}
  .btn-primary{background:#178A4E;color:#fff}
  .btn-primary:hover{background:#1FA862}
  .btn-wa{background:#25D366;color:#fff}
  .btn-wa:hover{background:#22bf5b}
  .btn-wa svg{width:20px;height:20px;fill:#fff}

  /* Floating quick action buttons on bottom right */
  .float{position:fixed;right:calc(18px + env(safe-area-inset-right, 0px));bottom:calc(18px + env(safe-area-inset-bottom, 0px));z-index:60;display:flex;flex-direction:column;gap:10px}
  .float a{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35);text-decoration:none;transition:transform .15s}
  .float a:hover{transform:scale(1.06)}
  .float a svg{width:26px;height:26px}
  .float .wa{background:#25D366}
  .float .ph{background:#178A4E}
  @media (max-width:500px){
    .btns .btn{flex:1 1 100%}
    .float a{width:50px;height:50px}
    .float a svg{width:23px;height:23px}
  }
</style>
</head>
<body>
  <main>
    <a href="index.html" class="logo-link">
      <img class="logo" src="images/geohawk-aerials-logo.png" data-src="images/geohawk-aerials-logo.png" alt="GeoHawk Aerials" width="190" height="104" onerror="if(!this.dataset.retry){this.dataset.retry='1';this.src='/images/geohawk-aerials-logo.png';}">

    <h1>Page not found</h1>

    <div class="btns">
      <a class="btn btn-primary" href="index.html" id="homeLink">Go to GeoHawk Aerials home</a>
      <a class="btn btn-wa" id="wa404" href="https://web.whatsapp.com/send?phone=917028478109" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2a8.2 8.2 0 01-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 01-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 00-.7.3 3 3 0 00-.9 2.2 5.2 5.2 0 001.1 2.7 11.8 11.8 0 004.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2s.2-1.1.2-1.2-.2-.2-.5-.3z"/></svg>
        WhatsApp us
      </a>
    </div>
  </main>

  <div class="float">
    <a class="wa" id="floatWa" href="https://web.whatsapp.com/send?phone=917028478109" target="_blank" rel="noopener" aria-label="Chat on WhatsApp" title="Chat on WhatsApp (+91 70284 78109)"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2a8.2 8.2 0 01-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 01-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 00-.7.3 3 3 0 00-.9 2.2 5.2 5.2 0 001.1 2.7 11.8 11.8 0 004.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2s.2-1.1.2-1.2-.2-.2-.5-.3z"/></svg></a>
    <a class="ph" href="tel:+917028478109" aria-label="Call +91 70284 78109" title="Call +91 70284 78109"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2"/></svg></a>
  </div>

  <script src="js/config.js?v=1" data-src="js/config.js"></script>
  <script>
    (function(){
      // Path resolution: handles local preview, root domain, or nested error paths on server
      const isNested = location.protocol !== 'file:' && location.pathname.split('/').filter(Boolean).length > 1;
      if (isNested) {
        document.querySelectorAll('[data-src]').forEach(el => {
          if (el.tagName === 'IMG') el.src = '/' + el.dataset.src;
          if (el.tagName === 'LINK') el.href = '/' + el.dataset.src;
          if (el.tagName === 'SCRIPT' && el.dataset.src) el.src = '/' + el.dataset.src;
        });
        const hl = document.getElementById('homeLink');
        if (hl) hl.href = '/';
        const ll = document.querySelector('.logo-link');
        if (ll) ll.href = '/';
      }

      const CFG = (typeof window !== 'undefined' && window.SITE_CONFIG) ? window.SITE_CONFIG : {
        email: "geohawkaerials@gmail.com",
        phoneDisplay: "+91 70284 78109",
        phoneRaw: "+917028478109",
        whatsappNumber: "917028478109",
        whatsappDisplay: "+91 70284 78109"
      };

      // Direct WhatsApp routing: WhatsApp Web on desktop, native app on mobile
      const WA_PHONE = CFG.whatsappNumber;
      const isMobile = /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
        (navigator.maxTouchPoints > 2 && /Macintosh/.test(navigator.userAgent));

      function openDirectWA(e){
        if (isMobile) {
          e.preventDefault();
          const start = Date.now();
          window.location.href = 'whatsapp://send?phone=' + WA_PHONE;
          setTimeout(() => {
            if (document.hasFocus() && Date.now() - start < 2000) {
              window.location.href = 'https://wa.me/' + WA_PHONE;
            }
          }, 1200);
        }
      }

      const waBtns = [document.getElementById('floatWa'), document.getElementById('wa404')].filter(Boolean);
      waBtns.forEach(btn => {
        if (isMobile) {
          btn.href = 'whatsapp://send?phone=' + WA_PHONE;
          btn.removeAttribute('target');
        } else {
          btn.href = 'https://web.whatsapp.com/send?phone=' + WA_PHONE;
          btn.target = '_blank';
          btn.rel = 'noopener';
        }
        btn.addEventListener('click', openDirectWA);
      });

      const phBtn = document.querySelector('.float .ph');
      if (phBtn) {
        phBtn.href = 'tel:' + CFG.phoneRaw;
        phBtn.setAttribute('title', 'Call ' + CFG.phoneDisplay);
        phBtn.setAttribute('aria-label', 'Call ' + CFG.phoneDisplay);
        phBtn.addEventListener('click', () => { window.location.href = 'tel:' + CFG.phoneRaw; });
      }
    })();
  </script>
